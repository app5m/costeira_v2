name: lucide_icons
description: Local patch of lucide_icons 0.257.0. IconData is final in the current Flutter SDK, so glyphs are constructed directly.
version: 0.257.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
